<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Mr. Emulator">
<defs><pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="1.8" fill="#000" opacity=".12"/></pattern>
<marker id="ar" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" refX="12" refY="11" orient="auto"><path d="M0 0 L22 11 L0 22 z" fill="#0b0b0f"/></marker></defs>
<rect width="1200" height="420" fill="#f6edd2"/><rect width="1200" height="420" fill="url(#dots)"/>
<g transform="translate(30 70)"><rect width="250" height="250" fill="#fff" stroke="#0b0b0f" stroke-width="7"/><rect width="250" height="52" fill="#17c964" stroke="#0b0b0f" stroke-width="7"/><text x="125" y="40" font-family="Impact, 'Arial Black', 'Arial Narrow', sans-serif" text-anchor="middle" font-size="28" letter-spacing="3" fill="#0b0b0f">I TUOI FILE</text><g font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0b0b0f"><text x="22" y="100">Le tue ROM</text><text x="22" y="135">I tuoi BIOS</text><text x="22" y="170">RetroArch (installato</text><text x="22" y="205">da te) e MAME</text></g></g>
<g transform="translate(345 40)"><rect width="320" height="310" fill="#fff" stroke="#0b0b0f" stroke-width="7"/><rect width="320" height="60" fill="#ff2d55" stroke="#0b0b0f" stroke-width="7"/><text x="160" y="45" font-family="Impact, 'Arial Black', 'Arial Narrow', sans-serif" font-weight="900" text-anchor="middle" font-size="32" fill="#fff" stroke="#0b0b0f" stroke-width="1">MR. EMULATOR</text><g font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0b0b0f"><text x="24" y="108">• Sceglie le impostazioni</text><text x="24" y="143">• Salvataggi: continua / nuova</text><text x="24" y="178">• Copertine, ricerca, statistiche</text><text x="24" y="213">• Comandi e pannello arcade</text><text x="24" y="248">• Schermo, bordi, shader</text><text x="24" y="283">• Trofei e trucchi</text></g></g>
<g transform="translate(730 70)"><rect width="250" height="250" fill="#fff" stroke="#0b0b0f" stroke-width="7"/><rect width="250" height="52" fill="#00b4d8" stroke="#0b0b0f" stroke-width="7"/><text x="125" y="40" font-family="Impact, 'Arial Black', 'Arial Narrow', sans-serif" text-anchor="middle" font-size="28" letter-spacing="3" fill="#0b0b0f">MOTORI</text><g font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0b0b0f"><text x="22" y="100">Core di RetroArch:</text><text x="22" y="135">NES, SNES, Mega Drive,</text><text x="22" y="170">PlayStation, N64…</text><text x="22" y="205">e MAME autonomo</text></g></g>
<g transform="translate(1030 110)"><rect width="150" height="170" fill="#1b1b2a" stroke="#0b0b0f" stroke-width="7"/><rect x="14" y="16" width="122" height="96" fill="#9ee9ff" stroke="#0b0b0f" stroke-width="5"/><polygon points="26,104 56,54 80,84 98,66 124,104" fill="#2a6f97" stroke="#0b0b0f" stroke-width="3"/><text x="75" y="138" font-family="Impact, 'Arial Black', 'Arial Narrow', sans-serif" text-anchor="middle" font-size="24" fill="#ffd400" letter-spacing="2">SCHERMO</text><text x="75" y="158" font-family="Arial" text-anchor="middle" font-size="12" fill="#fff">TV · monitor · cabinato</text></g>
<g stroke="#0b0b0f" stroke-width="7" marker-end="url(#ar)" fill="none"><line x1="285" y1="195" x2="338" y2="195"/><line x1="670" y1="195" x2="722" y2="195"/><line x1="985" y1="195" x2="1022" y2="195"/></g>
<g transform="translate(300 366) skewX(-8)"><rect width="640" height="36" fill="#ffd400" stroke="#0b0b0f" stroke-width="5"/><text x="320" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="16" fill="#0b0b0f">Non include né scarica mai ROM, BIOS o emulatori.</text></g>
<rect x="5" y="5" width="1190" height="410" fill="none" stroke="#0b0b0f" stroke-width="7"/></svg>
