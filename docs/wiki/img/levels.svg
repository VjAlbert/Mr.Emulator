<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="ONE LEVEL PER SYSTEM, CHOSEN FOR YOUR PC">
<defs><pattern id="d" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="1.8" fill="#000" opacity=".12"/></pattern></defs>
<rect width="1200" height="380" fill="#f6edd2"/><rect width="1200" height="380" fill="url(#d)"/>
<g transform="translate(40 28) skewX(-8)"><rect width="760" height="52" fill="#ffd400" stroke="#0b0b0f" stroke-width="6"/><text x="24" y="38" font-family="Impact, 'Arial Black', 'Arial Narrow', sans-serif" font-weight="900" font-size="28" textLength="712" lengthAdjust="spacingAndGlyphs" fill="#0b0b0f">ONE LEVEL PER SYSTEM, CHOSEN FOR YOUR PC</text></g>
<g transform="translate(40 110)"><rect width="340" height="220" fill="#fff" stroke="#0b0b0f" stroke-width="7"/><rect width="340" height="56" fill="#4cd964" stroke="#0b0b0f" stroke-width="7"/><text x="170" y="42" font-family="Impact, 'Arial Black', 'Arial Narrow', sans-serif" text-anchor="middle" font-size="30" letter-spacing="3" fill="#0b0b0f">LIGHT</text><g font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#0b0b0f"><text x="20" y="96">• Weak or old PC</text><text x="20" y="126">• No shaders</text><text x="20" y="156">• Threaded video</text><text x="20" y="186">• Maximum compatibility</text></g></g><g transform="translate(430 110)"><rect width="340" height="220" fill="#fff" stroke="#0b0b0f" stroke-width="7"/><rect width="340" height="56" fill="#ffd400" stroke="#0b0b0f" stroke-width="7"/><text x="170" y="42" font-family="Impact, 'Arial Black', 'Arial Narrow', sans-serif" text-anchor="middle" font-size="30" letter-spacing="3" fill="#0b0b0f">BALANCED</text><g font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#0b0b0f"><text x="20" y="96">• Typical laptop / PC</text><text x="20" y="126">• Light CRT shader</text><text x="20" y="156">• Low-latency run-ahead</text><text x="20" y="186">• Pixel sharpness: soft</text></g></g><g transform="translate(820 110)"><rect width="340" height="220" fill="#fff" stroke="#0b0b0f" stroke-width="7"/><rect width="340" height="56" fill="#ff2d55" stroke="#0b0b0f" stroke-width="7"/><text x="170" y="42" font-family="Impact, 'Arial Black', 'Arial Narrow', sans-serif" text-anchor="middle" font-size="30" letter-spacing="3" fill="#fff">MAXIMUM</text><g font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#0b0b0f"><text x="20" y="96">• Strong graphics card</text><text x="20" y="126">• CRT Royale / HLSL</text><text x="20" y="156">• xBRZ sharpness</text><text x="20" y="186">• Heavy systems stay safe</text></g></g>
<text x="600" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="15" fill="#3b362b">The program starts from your hardware and adapts each system after the question "how did it go?". You can force a level in Your PC.</text>
