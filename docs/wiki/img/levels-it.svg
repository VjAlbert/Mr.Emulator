<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="UN LIVELLO PER SISTEMA, SCELTO PER IL TUO PC">
<defs><pattern id="d" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="1.8" fill="#000" opacity=".12"/></pattern></defs>
<rect width="1200" height="380" fill="#f6edd2"/><rect width="1200" height="380" fill="url(#d)"/>
<g transform="translate(40 28) skewX(-8)"><rect width="760" height="52" fill="#ffd400" stroke="#0b0b0f" stroke-width="6"/><text x="24" y="38" font-family="Impact, 'Arial Black', 'Arial Narrow', sans-serif" font-weight="900" font-size="28" textLength="712" lengthAdjust="spacingAndGlyphs" fill="#0b0b0f">UN LIVELLO PER SISTEMA, SCELTO PER IL TUO PC</text></g>
<g transform="translate(40 110)"><rect width="340" height="220" fill="#fff" stroke="#0b0b0f" stroke-width="7"/><rect width="340" height="56" fill="#4cd964" stroke="#0b0b0f" stroke-width="7"/><text x="170" y="42" font-family="Impact, 'Arial Black', 'Arial Narrow', sans-serif" text-anchor="middle" font-size="30" letter-spacing="3" fill="#0b0b0f">LEGGERO</text><g font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#0b0b0f"><text x="20" y="96">• PC debole o vecchio</text><text x="20" y="126">• Nessuno shader</text><text x="20" y="156">• Video su thread separato</text><text x="20" y="186">• Massima compatibilità</text></g></g><g transform="translate(430 110)"><rect width="340" height="220" fill="#fff" stroke="#0b0b0f" stroke-width="7"/><rect width="340" height="56" fill="#ffd400" stroke="#0b0b0f" stroke-width="7"/><text x="170" y="42" font-family="Impact, 'Arial Black', 'Arial Narrow', sans-serif" text-anchor="middle" font-size="30" letter-spacing="3" fill="#0b0b0f">BILANCIATO</text><g font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#0b0b0f"><text x="20" y="96">• Portatile / PC tipico</text><text x="20" y="126">• Shader CRT leggero</text><text x="20" y="156">• Run-ahead (meno ritardo)</text><text x="20" y="186">• Nitidezza: morbida</text></g></g><g transform="translate(820 110)"><rect width="340" height="220" fill="#fff" stroke="#0b0b0f" stroke-width="7"/><rect width="340" height="56" fill="#ff2d55" stroke="#0b0b0f" stroke-width="7"/><text x="170" y="42" font-family="Impact, 'Arial Black', 'Arial Narrow', sans-serif" text-anchor="middle" font-size="30" letter-spacing="3" fill="#fff">MASSIMO</text><g font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#0b0b0f"><text x="20" y="96">• Scheda video potente</text><text x="20" y="126">• CRT Royale / HLSL</text><text x="20" y="156">• Nitidezza xBRZ</text><text x="20" y="186">• Sistemi pesanti al sicuro</text></g></g>
<text x="600" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="15" fill="#3b362b">Il programma parte dal tuo hardware e si adatta a ogni sistema con la domanda «com'è andata?». In «Il tuo PC» puoi forzare un livello.</text>
<rect x="5" y="5" width="1190" height="370" fill="none" stroke="#0b0b0f" stroke-width="7"/></svg>
