name: Installer per Windows

# Si avvia a mano (Actions -> Run workflow) oppure quando si crea un tag come v0.2.0.
# Costruisce l'installer su una macchina Windows di GitHub (gratuita) e lo allega alla release.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release with the installer (tag vX.Y.Z taken from package.json)'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v6
        with:
          name: Mr-Emulator-Setup
          path: release/Mr-Emulator-Setup-*.exe
      - name: Read the version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish the release with the installer
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.v.outputs.version) }}
          name: Mr. Emulator ${{ steps.v.outputs.version }}
          files: release/Mr-Emulator-Setup-*.exe
          body_path: docs/RELEASE_NOTES.md
