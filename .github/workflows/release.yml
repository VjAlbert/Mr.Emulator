name: Installer per Windows

# Si avvia a mano (Actions -> Run workflow) oppure quando si crea un tag come v0.2.0.
# Costruisce l'installer su una macchina Windows di GitHub (gratuita) e lo allega alla release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Mr-Emulator-Setup
          path: release/Mr-Emulator-Setup-*.exe
      - name: Allega l'installer alla release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/Mr-Emulator-Setup-*.exe
