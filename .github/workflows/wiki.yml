name: Pubblica la wiki

# Copia le pagine di docs/wiki nella Wiki di GitHub (repository <repo>.wiki).
# Si avvia a mano (Actions -> Run workflow) o quando cambiano i file in docs/wiki.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/wiki/*.md']

permissions:
  contents: write

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Copy the pages into the wiki repository
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          git clone "https://x-access-token:${TOKEN}@github.com/${REPO}.wiki.git" wiki
          # le pagine si rifanno da capo: quelle tolte da docs/wiki spariscono anche dalla wiki
          find wiki -maxdepth 1 -name '*.md' -delete
          cp docs/wiki/*.md wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date"
          else
            git commit -m "Update wiki from docs/wiki (${GITHUB_SHA::7})"
            git push
          fi
